# BrandBaazi is a static site with one optional function (Fast mode, off until GROQ_API_KEY is set).
[build]
  publish = "site"
  command = "echo 'Static site, nothing to build'"
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Camera and microphone are only used by Live captions, on this site itself.
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=()"

# Code changes ship immediately; browsers re-check JS/CSS on each visit.
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The service worker must always be fresh, or updates would be held back.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# The studio is the home page: "/" shows app.html (the URL stays "/"). The old landing page is /about.html.
[[redirects]]
  from = "/"
  to = "/app.html"
  status = 200
  force = true
