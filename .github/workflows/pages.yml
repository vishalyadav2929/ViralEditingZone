name: Deploy BrandBaazi site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # "/" should be the studio itself (not a redirect page) so search engines read its title,
      # description and icons straight from the homepage. app.html's canonical already points to "/".
      - name: Build (studio at /)
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp site/app.html _site/index.html
      - name: Upload site folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
